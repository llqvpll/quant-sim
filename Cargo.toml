[package]
name = "quant-sim"
version = "0.3.0"
edition = "2021"
description = "A 股 AI 模拟盘量化交易系统"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
